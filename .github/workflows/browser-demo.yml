name: Browser demo parity

on:
  pull_request:
  push:
    branches: [main, ui-implementation]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frontporch_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:demo-ci-only@localhost:5432/frontporch_demo
      DJANGO_SETTINGS_MODULE: frontporch.settings
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --frozen --python 3.12
      - name: Check generated demo assets
        run: uv run --frozen python manage.py export_browser_demo --check
      - name: Check browser workflows
        run: |
          node --check ui-prototype/dist/app.js
          node --check ui-prototype/dist/model.js
          node --test ui-prototype/tests/*.test.cjs
      - name: Compare demo permissions with Django
        run: uv run --frozen python manage.py test directory.tests.test_browser_demo --noinput
