name: Deploy browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep uploads serial and let an in-progress deployment finish.
concurrency:
  group: browser-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frontporch_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:demo-ci-only@localhost:5432/frontporch_demo
      DJANGO_SETTINGS_MODULE: frontporch.settings
    steps:
      - uses: actions/checkout@v7
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets. See ui-prototype/deploy/cloudflare-pages.md."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --frozen --python 3.12
      - name: Regenerate demo assets from Django
        run: |
          uv run --frozen python manage.py export_browser_demo
          uv run --frozen python manage.py export_browser_demo --check
      - name: Check browser workflows
        run: |
          node --check ui-prototype/dist/app.js
          node --check ui-prototype/dist/model.js
          node --test ui-prototype/tests/*.test.cjs
      - name: Compare demo permissions with Django
        run: uv run --frozen python manage.py test directory.tests.test_browser_demo --noinput
      - name: Check this commit is still main
        id: current
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping this superseded commit; a newer main commit will deploy."
            echo "Skipped deployment: this commit is no longer the head of main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.135.0 pages deploy ui-prototype/dist \
            --project-name front-demo --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=true
          echo "Published $GITHUB_SHA to [the browser demo](https://front-demo.porchlab.app)." >> "$GITHUB_STEP_SUMMARY"
