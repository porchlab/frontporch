name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frontporch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-ci-only@localhost:5432/frontporch_test
      DJANGO_SETTINGS_MODULE: frontporch.settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --frozen --python 3.12
      - name: Run the full Django test suite
        # DOM integration tests parse the actual Django phonebook HTML in Node.
        # These locked development dependencies are not part of the runtime.
        run: |
          npm ci --prefix ui-prototype --ignore-scripts
          uv run --frozen python manage.py test --noinput

  deployment-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check deployment policy and denial scenarios
        run: |
          python deploy/automation/check_workflows.py
          python -m unittest discover -s tests/deployment -v
          sh -n deploy/automation/receive.sh

  image-check:
    needs: deployment-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Build Django image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: frontporch-web:ci
          platforms: linux/amd64
      - name: Build Asterisk image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: asterisk/Dockerfile
          load: true
          tags: frontporch-asterisk:registration-test
          platforms: linux/amd64
      - name: Exercise both images without publishing
        run: |
          python deploy/test_release_image.py frontporch-web:ci
          python deploy/test_asterisk_registration.py

  images:
    needs: [tests, deployment-policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'porchlab/frontporch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: frontporch-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      asterisk_digest: ${{ steps.existing.outputs.digest || steps.asterisk.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse the published image for unchanged Asterisk build inputs
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PBX_TAG: inputs-${{ hashFiles('asterisk/Dockerfile', 'asterisk/core-sounds-entrypoint.sh', '.dockerignore') }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api --paginate /orgs/porchlab/packages/container/frontporch-asterisk/versions \
              > "$RUNNER_TEMP/pbx-versions.json" 2> "$RUNNER_TEMP/pbx-error"; then
            digest=$(jq -r --arg tag "$PBX_TAG" '.[] | select(.metadata.container.tags | index($tag)) | .name' "$RUNNER_TEMP/pbx-versions.json")
            if [[ -n "$digest" ]]; then
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
            fi
          elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/pbx-error"; then
            cat "$RUNNER_TEMP/pbx-error" >&2
            exit 1
          fi
      - name: Publish changed Asterisk image
        id: asterisk
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: asterisk/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/porchlab/frontporch-asterisk:inputs-${{ hashFiles('asterisk/Dockerfile', 'asterisk/core-sounds-entrypoint.sh', '.dockerignore') }}
          labels: org.opencontainers.image.source=https://github.com/porchlab/frontporch
      - name: Publish Django image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/porchlab/frontporch:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/porchlab/frontporch
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate the published images before authorizing deployment
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ASTERISK_DIGEST: ${{ steps.existing.outputs.digest || steps.asterisk.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASTERISK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "ghcr.io/porchlab/frontporch@$WEB_DIGEST"
          docker pull "ghcr.io/porchlab/frontporch-asterisk@$ASTERISK_DIGEST"
          python deploy/test_release_image.py "ghcr.io/porchlab/frontporch@$WEB_DIGEST"
          FRONTPORCH_ASTERISK_TEST_IMAGE="ghcr.io/porchlab/frontporch-asterisk@$ASTERISK_DIGEST" \
            python deploy/test_asterisk_registration.py

  deploy:
    needs: [tests, deployment-policy, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'porchlab/frontporch' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: frontporch-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check this revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api repos/porchlab/frontporch/git/ref/heads/main --jq .object.sha)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped superseded revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Join deployment network
        if: steps.current.outputs.deploy == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ secrets.TS_DEPLOY_AUDIENCE }}
          tags: tag:frontporch-deploy
          version: '1.94.2'
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: 'false'
      - name: Disable subnet route acceptance
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        # The pinned action adds --accept-routes; a duplicate up flag is invalid.
        # Tailnet policy permits only the production host's TCP 22 during join.
        run: sudo tailscale set --accept-routes=false
      - name: Request the fixed host deployment
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
          ASTERISK_DIGEST: ${{ needs.images.outputs.asterisk_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASTERISK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/frontporch-deploy.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$work/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$work/known_hosts"
          if ssh -F /dev/null -T -i "$work/key" -p 22 -l "$DEPLOY_USER" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$work/known_hosts" -o GlobalKnownHostsFile=/dev/null \
              -o ClearAllForwardings=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "$DEPLOY_HOST" "$GITHUB_SHA $WEB_DIGEST $ASTERISK_DIGEST" > "$work/result" 2>&1; then
            echo "Deployed revision $GITHUB_SHA; host verification passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Deployment failed. Inspect private host deployment logs.'
            exit 1
          fi
