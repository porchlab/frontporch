services:
  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    image: frontporch-asterisk
    environment:
      TZ: ${TZ:-America/New_York}
    network_mode: host
    healthcheck:
      disable: true
    volumes:
      # Includes AstDB's registered phone contacts; retain across replacements.
      - asterisk-data:/var/lib/asterisk
      - ${ASTERISK_ETC_DIR:?set ASTERISK_ETC_DIR}:/etc/asterisk
      - ${ASTERISK_CONF_D_DIR:?set ASTERISK_CONF_D_DIR}:/etc/asterisk/conf.d
      - ${ASTERISK_LOG_DIR:?set ASTERISK_LOG_DIR}:/var/log/asterisk
      - ${ASTERISK_SPOOL_DIR:?set ASTERISK_SPOOL_DIR}:/var/spool/asterisk
      - ${ASTERISK_CUSTOM_SOUNDS_DIR:-./asterisk/sounds}:/var/lib/asterisk/sounds/frontporch:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             exec gunicorn frontporch.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-60}"
    environment:
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST:?set ASTERISK_AMI_HOST}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT:-5038}
      ASTERISK_AMI_USERNAME: ${ASTERISK_AMI_USERNAME:?set ASTERISK_AMI_USERNAME}
      ASTERISK_AMI_PASSWORD: ${ASTERISK_AMI_PASSWORD:?set ASTERISK_AMI_PASSWORD}
      ASTERISK_AMI_TIMEOUT: ${ASTERISK_AMI_TIMEOUT:-5}
      ASTERISK_AUTO_APPLY_CONFIG: ${ASTERISK_AUTO_APPLY_CONFIG:-true}
      ASTERISK_CUSTOM_SOUNDS_DIR: /var/lib/asterisk/sounds/frontporch
      ASTERISK_GENERATED_CONFIG_DIR: /etc/asterisk/conf.d
      ASTERISK_OUTBOUND_CALLER_ID: ${ASTERISK_OUTBOUND_CALLER_ID:-}
      ASTERISK_TTS_ENGINE_SIGNATURE: ${ASTERISK_TTS_ENGINE_SIGNATURE:-piper-tts-1.7.0_en_US-ljspeech-medium-f5a6e9094787_sox-14.4.2+git20190427-3.5}
      ASTERISK_TTS_LENGTH_SCALE: ${ASTERISK_TTS_LENGTH_SCALE:-1.0}
      ASTERISK_TTS_MODEL_PATH: ${ASTERISK_TTS_MODEL_PATH:-/opt/frontporch/piper/en_US-ljspeech-medium.onnx}
      ASTERISK_TTS_NOISE_SCALE: ${ASTERISK_TTS_NOISE_SCALE:-0.667}
      ASTERISK_TTS_NOISE_W_SCALE: ${ASTERISK_TTS_NOISE_W_SCALE:-0.8}
      ASTERISK_TTS_RANDOM_SEED: ${ASTERISK_TTS_RANDOM_SEED:-1729}
      ASTERISK_TTS_VOICE: ${ASTERISK_TTS_VOICE:-en_US-ljspeech-medium}
      ASTERISK_TTS_VOLUME: ${ASTERISK_TTS_VOLUME:-1.0}
      DATABASE_URL: postgres://${POSTGRES_USER:-frontporch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frontporch}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-25}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-false}
      DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-false}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-noreply@example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      FRONTPORCH_PUBLIC_URL: ${FRONTPORCH_PUBLIC_URL:-}
      FRONTPORCH_DEMO_URL: ${FRONTPORCH_DEMO_URL-https://front-demo.porchlab.app/#family/overview}
      FRONTPORCH_DEFAULT_PHONE_REGION: ${FRONTPORCH_DEFAULT_PHONE_REGION:-US}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      TZ: ${TZ:-America/New_York}
    ports:
      - ${FRONTPORCH_WEB_BIND_IP:?set FRONTPORCH_WEB_BIND_IP}:${FRONTPORCH_WEB_PORT:-8000}:8000
    volumes:
      - ${ASTERISK_CONF_D_DIR:?set ASTERISK_CONF_D_DIR}:/etc/asterisk/conf.d
      - ${ASTERISK_CUSTOM_SOUNDS_DIR:-./asterisk/sounds}:/var/lib/asterisk/sounds/frontporch
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frontporch}
      POSTGRES_USER: ${POSTGRES_USER:-frontporch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TZ:-America/New_York}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frontporch} -d ${POSTGRES_DB:-frontporch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  asterisk-data:
    name: ${ASTERISK_VOLUME_NAME:-frontporch-asterisk-data}
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-frontporch-postgres}
