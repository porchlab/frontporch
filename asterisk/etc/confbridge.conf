; /etc/asterisk/confbridge.conf
; FrontPorch conference mechanics. Membership and routing stay in generated dialplan.

[general]

[frontporch-bridge]
type=bridge
sound_join=confbridge-join
sound_leave=confbridge-leave

[frontporch-user]
type=user
quiet=no
announce_join_leave=no
dtmf_passthrough=no

[frontporch-menu]
type=menu
*=dialplan_exec(frontporch-conference-redial,s,1)
