{% load socialaccount static %}
{% get_providers as social_providers %}
{% if social_providers %}
    <div class="provider-buttons" role="group" aria-label="{% if process == 'connect' %}Connect a sign-in account{% else %}Sign in options{% endif %}">
        {% for provider in social_providers %}
            <form method="post" action="{% provider_login_url provider.id process=process|default:'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <button class="provider-button provider-button-{{ provider.id }}" type="submit">
                    {% if provider.id == "google" %}
                        <img class="provider-logo" src="{% static 'directory/auth/google.png' %}" alt="" width="20" height="20">
                    {% elif provider.id == "apple" %}
                        <img class="provider-logo" src="{% static 'directory/auth/apple.svg' %}" alt="" width="31" height="44">
                    {% endif %}
                    <span>{% if process == "connect" %}Connect{% else %}Continue with{% endif %} {{ provider.name }}</span>
                </button>
            </form>
        {% endfor %}
    </div>
    {% if show_email_divider %}<p class="auth-divider">or continue with email</p>{% endif %}
{% endif %}
